<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <link rel="stylesheet" href="../assets/styles/forms.css">
</head>
<body>
    <h1>Missão Formulário</h1>
    
    <section>
        <form action="#">
            <div class="inputs">
            <label for="nome">Digite o nome do ninja!</label>
            <input type="text" placeholder="Ex: Madara Uchiha" required />
            </div>

            <div class="rank">
                <label for="rank">Selecione o nível do ninja!</label>
                <select name="rank" id="rank">
                    <option value="">Selecione...</option>
                    <option value="genin">Genin</option>
                    <option value="chunin">Chnin</option>
                    <option value="jonin">Jonin</option>
                    <option value="kage">Kage</option>
                </select>
            </div>

            <div class="tipo">
                <label for="tipo">Qual o nível da missão</label>
                <div>
                    <label for="d">
                        <input type="radio" name="tipo" value="d">
                        D
                    </label>
                </div>
                <div>
                    <label for="c">
                        <input type="radio" name="tipo" value="c">
                        C
                    </label>
                </div>
                <div>
                    <label for="b">
                        <input type="radio" name="tipo" value="b">
                        B
                    </label>
                </div>
                <div>
                    <label for="a">
                        <input type="radio" name="tipo" value="a">
                        A
                    </label>
                </div>
                <div>
                    <label for="s">
                        <input type="radio" name="tipo" value="s">
                        S
                    </label>
                </div>
            </div>
           <div class="especialidades">
                <label for="especialidades">Qual a especialidade ninja?</label>
                <div>
                 <label for="taijutsu">
                     <input type="checkbox" name="especialidades" value="taijutsu">👊 Taijutsu
                    </label>
                </div>
                <div>
                  <label for="ninjutsu">
                       <input type="checkbox" name="especialidades" value="  ninjutsu">⚡Ninjutsu
                  </label>
                </div>
                <div>
                    <label for="genjutsu">
                        <input type="checkbox" name="especialidades" value=" genjutsu">🌀 Genjutsu
                    </label>
                </div>
                <div>
                    <label for="medico">
                        <input type="checkbox" name="especialidades" value="medico">🏥 Ninja Médico
                    </label>
            </div>
           </div>
           <div class="descricao"></div>
           <label for="descricao">Qual a descrição do ninja?</label>
           <textarea name="descricao" id="descricao" placeholder="Digite as caracteristicas do ninja..." rows="4"></textarea>
        </form>
    </section>
</body>
</html>
